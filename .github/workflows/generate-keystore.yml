name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore kids-tracker.keystore \
            -alias kidsactivity \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kidsapp2024 \
            -keypass kidsapp2024 \
            -dname "CN=Kids Activity Tracker, OU=App, O=KidsApp, L=Dubai, S=Dubai, C=AE"

      - name: Print SHA256
        run: |
          echo "===== COPY THIS SHA256 ====="
          keytool -list -v \
            -keystore kids-tracker.keystore \
            -alias kidsactivity \
            -storepass kidsapp2024 | grep SHA256
          echo "============================"

      - name: Print Base64
        run: |
          echo "===== COPY THIS BASE64 ====="
          base64 -w 0 kids-tracker.keystore
          echo ""
          echo "============================"
