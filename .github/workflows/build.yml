name: Build Kids Activity Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

      - name: Create twa-manifest.json (skip interactive init)
        run: |
          mkdir -p twa-build
          cat > twa-build/twa-manifest.json << 'TWAJSON'
          {
            "packageId": "com.kidsactivitytracker.app",
            "host": "salmanhathi.github.io",
            "name": "Kids Activity Tracker",
            "launcherName": "KidsTracker",
            "display": "standalone",
            "themeColor": "#0d0d2b",
            "navigationColor": "#0d0d2b",
            "navigationColorDark": "#0d0d2b",
            "navigationDividerColor": "#0d0d2b",
            "navigationDividerColorDark": "#0d0d2b",
            "backgroundColor": "#060618",
            "enableNotifications": true,
            "startUrl": "/kids-activity-tracker/index.html",
            "iconUrl": "https://salmanhathi.github.io/kids-activity-tracker/icon-512.png",
            "maskableIconUrl": "https://salmanhathi.github.io/kids-activity-tracker/icon-512.png",
            "monochromeIconUrl": "https://salmanhathi.github.io/kids-activity-tracker/icon-512.png",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "kidsactivity"
            },
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://salmanhathi.github.io/kids-activity-tracker/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://salmanhathi.github.io/kids-activity-tracker/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSideNavigation": false,
            "serviceAccountJsonFile": ""
          }
          TWAJSON

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias kidsactivity \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kidsapp2024 \
            -keypass kidsapp2024 \
            -dname "CN=Kids Activity Tracker, OU=App, O=KidsApp, L=Dubai, S=Dubai, C=AE"

      - name: Build APK with Bubblewrap
        working-directory: twa-build
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath ../android.keystore \
            --signingKeyAlias kidsactivity \
            --signingKeyPassword kidsapp2024 \
            --signingStorePassword kidsapp2024
        env:
          BUBBLEWRAP_SKIP_JAVA_CHECK: "1"

      - name: Find output files
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-activity-tracker-apk
          path: |
            twa-build/**/*.apk
            twa-build/**/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kids Activity Tracker v1.0.${{ github.run_number }}
          files: |
            twa-build/**/*.apk
            twa-build/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
