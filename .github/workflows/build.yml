name: Build Kids Activity Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Create project directories
        run: |
          mkdir -p twa-app/app/src/main/res/mipmap-mdpi
          mkdir -p twa-app/app/src/main/res/mipmap-hdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xhdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p twa-app/app/src/main/res/values
          mkdir -p twa-app/gradle/wrapper

      - name: Download app icon
        run: |
          curl -L "https://salmanhathi.github.io/kids-activity-tracker/icon-192.png" -o icon.png || true
          for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon.png twa-app/app/src/main/res/mipmap-$size/ic_launcher.png
            cp icon.png twa-app/app/src/main/res/mipmap-$size/ic_launcher_round.png
          done

      - name: Write gradle-wrapper.properties
        run: |
          cat > twa-app/gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS

      - name: Write gradle.properties
        run: |
          cat > twa-app/gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          PROPS

      - name: Write settings.gradle
        run: |
          cat > twa-app/settings.gradle << 'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidsActivityTracker"
          include ':app'
          GRADLE

      - name: Write root build.gradle
        run: |
          cat > twa-app/build.gradle << 'GRADLE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          GRADLE

      - name: Write app build.gradle
        run: |
          cat > twa-app/app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.kidsactivitytracker.app'
              defaultConfig {
                  applicationId 'com.kidsactivitytracker.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }
              signingConfigs {
                  release {
                      storeFile file('../../android.keystore')
                      storePassword 'kidsapp2024'
                      keyAlias 'kidsactivity'
                      keyPassword 'kidsapp2024'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.browser:browser:1.7.0'
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          GRADLE

      - name: Write AndroidManifest.xml
        run: |
          cat > twa-app/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Kids Activity Tracker"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:supportsRtl="true">
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://salmanhathi.github.io/kids-activity-tracker/index.html"/>
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:value="#0d0d2b"/>
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                          android:value="#060618"/>
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION"
                          android:value="300"/>
                      <meta-data
                          android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY"
                          android:value="com.kidsactivitytracker.app.fileprovider"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https"
                                android:host="salmanhathi.github.io"
                                android:pathPrefix="/kids-activity-tracker"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

      - name: Write strings.xml
        run: |
          cat > twa-app/app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Kids Activity Tracker</string>
          </resources>
          XML

      - name: Install Gradle wrapper
        working-directory: twa-app
        run: gradle wrapper --gradle-version=8.4

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias kidsactivity \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kidsapp2024 \
            -keypass kidsapp2024 \
            -dname "CN=Kids Activity Tracker, OU=App, O=KidsApp, L=Dubai, S=Dubai, C=AE"

      - name: Build release APK
        working-directory: twa-app
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        run: find twa-app -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-activity-tracker-apk
          path: twa-app/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kids Activity Tracker v1.0.${{ github.run_number }}
          files: twa-app/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
