name: Build Kids Activity Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-create build directory
        run: mkdir -p twa-build

      - name: Configure Bubblewrap JDK/SDK paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Init Bubblewrap (non-interactive)
        run: |
          yes "" | bubblewrap init \
            --manifest "https://${{ github.repository_owner }}.github.io/kids-activity-tracker/manifest.json" \
            --directory twa-build
        env:
          BUBBLEWRAP_SKIP_JAVA_CHECK: "1"
          CI: "true"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore twa-build/android.keystore \
            -alias kidsactivity \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kidsapp2024 \
            -keypass kidsapp2024 \
            -dname "CN=Kids Activity Tracker, OU=App, O=KidsApp, L=Dubai, S=Dubai, C=AE"

      - name: Build APK
        working-directory: twa-build
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath ../twa-build/android.keystore \
            --signingKeyAlias kidsactivity \
            --signingKeyPassword kidsapp2024 \
            --signingStorePassword kidsapp2024
        env:
          BUBBLEWRAP_SKIP_JAVA_CHECK: "1"

      - name: List build output
        run: find twa-build -name "*.apk" -o -name "*.aab" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-activity-tracker-apk
          path: |
            twa-build/**/*.apk
            twa-build/**/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kids Activity Tracker v1.0.${{ github.run_number }}
          files: |
            twa-build/**/*.apk
            twa-build/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
