name: Build Kids Activity Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Bubblewrap project
        run: |
          bubblewrap init \
            --manifest=https://${{ github.repository_owner }}.github.io/kids-activity-tracker/manifest.json \
            --directory=twa-build
        env:
          BUBBLEWRAP_SKIP_JAVA_CHECK: 1

      - name: Build APK and AAB
        working-directory: twa-build
        run: |
          bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_JAVA_CHECK: 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-activity-tracker-apk
          path: |
            twa-build/*.apk
            twa-build/*.aab
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kids Activity Tracker v1.0.${{ github.run_number }}
          files: |
            twa-build/*.apk
            twa-build/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
